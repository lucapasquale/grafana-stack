# Every container writes its stdout to a json-file on the LXC's disk, unbounded
# by default: cap it, or a chatty service can fill the filesystem and take the
# stack down with it.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

configs:
  grafana_datasources:
    content: |
      apiVersion: 1

      # Grafana can't change the uid of an existing datasource, so these are
      # deleted and recreated on startup. The uids are the ones Grafana generates
      # for these names, so dashboards created in the UI keep working
      deleteDatasources:
        - name: Prometheus
          orgId: 1
        - name: Loki
          orgId: 1

      datasources:
        - name: Prometheus
          type: prometheus
          uid: PBFA97CFB590B2093
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: true

        - name: Loki
          type: loki
          uid: P8E80F9AEF21F6940
          access: proxy
          url: http://loki:3100
          editable: true
          jsonData:
            derivedFields:
              - datasourceUid: tempo
                matcherRegex: '"trace_id":"(\w+)"'
                name: trace_id
                url: "$${__value.raw}"

        - name: Tempo
          type: tempo
          access: proxy
          uid: tempo
          url: http://tempo:3100
          editable: true
          jsonData:
            tracesToLogsV2:
              datasourceUid: P8E80F9AEF21F6940
              filterByTraceID: true
            tracesToMetrics:
              datasourceUid: PBFA97CFB590B2093
            serviceMap:
              datasourceUid: PBFA97CFB590B2093
            lokiSearch:
              datasourceUid: P8E80F9AEF21F6940

  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      scrape_configs:
        - job_name: "prometheus"
          static_configs:
            - targets: ["localhost:9090"]

        # The stack's own containers. The per-service /metrics jobs give each
        # process's RSS; the cadvisor job gives per-container usage against the
        # mem_limit below, which is the number that matters when something
        # grows without a bound. Nothing scraped the stack itself before.
        - job_name: "cadvisor"
          static_configs:
            - targets: ["cadvisor:8080"]

        - job_name: "grafana"
          static_configs:
            - targets: ["grafana:3000"]

        - job_name: "loki"
          static_configs:
            - targets: ["loki:3100"]

        - job_name: "tempo"
          static_configs:
            # 3100, not Tempo's 3200 default: this config sets
            # server.http_listen_port: 3100 (same port the Grafana datasource
            # uses), so 3200 never answers — the scrape came back
            # "connection refused" on tempo:3200.
            - targets: ["tempo:3100"]

        - job_name: "alloy"
          static_configs:
            - targets: ["alloy:12345"]

  loki_config:
    content: |
      auth_enabled: false

      server:
        http_listen_port: 3100
        grpc_listen_port: 9096

      common:
        path_prefix: /loki
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory

      schema_config:
        configs:
          - from: "2020-10-24"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      limits_config:
        allow_structured_metadata: true
        volume_enabled: true
        retention_period: 360h

      compactor:
        working_directory: /loki/compactor
        compaction_interval: 10m
        retention_enabled: true
        retention_delete_delay: 2h
        retention_delete_worker_count: 150
        delete_request_store: filesystem

  tempo_config:
    content: |
      server:
        http_listen_port: 3100

      distributor:
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: "0.0.0.0:4317"
              http:
                endpoint: "0.0.0.0:4318"

      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/blocks
          wal:
            path: /var/tempo/wal

      metrics_generator:
        processor:
          service_graphs:
            dimensions:
              - service.name
          span_metrics:
            dimensions:
              - service.name
        storage:
          path: /var/tempo/generator/wal
          remote_write:
            - url: http://prometheus:9090/api/v1/write
              send_exemplars: true

      compactor:
        compaction:
          block_retention: 360h

      overrides:
        defaults:
          metrics_generator:
            processors:
              - service-graphs
              - span-metrics

  alloy_config:
    content: |
      // Alloy config - collects local Docker container logs and accepts remote log pushes

      // ============================================================
      // Remote log ingestion (for services on other VMs like botchini)
      // Accepts Loki push API on port 9095
      // ============================================================
      loki.source.api "push_receiver" {
        http {
          listen_address = "0.0.0.0"
          listen_port    = 9095
        }
        forward_to = [loki.process.remote.receiver]
      }

      loki.process "remote" {
        forward_to = [loki.write.loki.receiver]

        stage.json {
          expressions = {
            level   = "severity",
            message = "message",
          }
        }

        stage.labels {
          values = {
            level = "",
          }
        }
      }

      // ============================================================
      // Local Docker container log collection
      // ============================================================

      // Discover Docker containers
      discovery.docker "containers" {
        host = "unix:///var/run/docker.sock"
      }

      // Relabel to extract useful metadata
      discovery.relabel "containers" {
        targets = discovery.docker.containers.targets

        rule {
          source_labels = ["__meta_docker_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_docker_container_log_stream"]
          target_label  = "stream"
        }

        rule {
          source_labels = ["__meta_docker_container_label_com_docker_compose_service"]
          target_label  = "service"
        }

        rule {
          source_labels = ["__meta_docker_container_label_com_docker_compose_project"]
          target_label  = "project"
        }
      }

      // Collect logs from discovered containers
      loki.source.docker "containers" {
        host       = "unix:///var/run/docker.sock"
        targets    = discovery.relabel.containers.output
        forward_to = [loki.process.containers.receiver]
      }

      // Process and parse JSON logs (from LoggerJSON)
      loki.process "containers" {
        forward_to = [loki.write.loki.receiver]

        stage.json {
          expressions = {
            level   = "severity",
            message = "message",
          }
        }

        stage.labels {
          values = {
            level = "",
          }
        }
      }

      // Write to Loki
      loki.write "loki" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }

      // ============================================================
      // Scrape botchini /metrics through Cloudflare tunnel
      // ============================================================
      prometheus.scrape "botchini" {
        job_name = "botchini"
        targets = [{"__address__" = "botchini-metrics.luca.codes", "__metrics_path__" = "/metrics"}]
        forward_to = [prometheus.remote_write.default.receiver]
        scrape_interval = "15s"
        scheme = "https"

        http_headers = {
          "CF-Access-Client-Id"     = [sys.env("CF_ACCESS_CLIENT_ID")],
          "CF-Access-Client-Secret" = [sys.env("CF_ACCESS_CLIENT_SECRET")],
        }
      }

      prometheus.remote_write "default" {
        endpoint {
          url = "http://prometheus:9090/api/v1/write"
        }
      }

  # BEGIN GENERATED CONFIGS (scripts/embed_configs.py)
  grafana_alerting_botchini:
    content: |
      apiVersion: 1

      contactPoints:
        - orgId: 1
          name: Discord
          receivers:
            - uid: discord-alerts
              type: discord
              settings:
                url: $${DISCORD_ALERT_WEBHOOK_URL}
                use_discord_username: false

      # Each rule sends its notifications straight to the Discord contact point, so
      # provisioning doesn't replace the root notification policy set up in Grafana
      groups:
        - orgId: 1
          name: botchini
          folder: Botchini
          interval: 1m
          rules:
            - uid: botchini-failed-commands
              title: Botchini commands failing
              condition: C
              for: 0s
              noDataState: OK
              execErrState: Error
              labels:
                service: botchini
              notification_settings:
                receiver: Discord
                group_by: ["alertname"]
                repeat_interval: 4h
              annotations:
                summary: '{{ printf "%.0f" .Values.B.Value }} Discord interactions failed in the last 15 minutes'
                description: "Commands are raising or Discord is rejecting their responses. Check the Botchini - Overview dashboard logs for the stacktraces."
              data:
                - refId: A
                  relativeTimeRange: { from: 900, to: 0 }
                  datasourceUid: PBFA97CFB590B2093
                  model:
                    refId: A
                    expr: sum(increase(botchini_discord_interaction_count{status="error"}[15m]))
                    instant: true
                - refId: B
                  datasourceUid: __expr__
                  model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
                - refId: C
                  datasourceUid: __expr__
                  model:
                    refId: C
                    type: threshold
                    expression: B
                    conditions:
                      - evaluator: { type: gt, params: [2] }

            - uid: botchini-playback-failures
              title: Botchini music playback failing
              condition: C
              for: 0s
              noDataState: OK
              execErrState: Error
              labels:
                service: botchini
              notification_settings:
                receiver: Discord
                group_by: ["alertname"]
                repeat_interval: 4h
              annotations:
                summary: '{{ printf "%.0f" .Values.B.Value }} tracks couldn''t be played in the last 30 minutes'
                description: "Check the failure reasons on the Botchini - Overview dashboard. bot_check, forbidden and rate_limited usually mean YouTube is blocking the server."
              data:
                - refId: A
                  relativeTimeRange: { from: 1800, to: 0 }
                  datasourceUid: PBFA97CFB590B2093
                  model:
                    refId: A
                    expr: sum(increase(botchini_music_track_failure_count{reason!~"age_restricted|unavailable|unsupported_url|stream_offline"}[30m]))
                    instant: true
                - refId: B
                  datasourceUid: __expr__
                  model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
                - refId: C
                  datasourceUid: __expr__
                  model:
                    refId: C
                    type: threshold
                    expression: B
                    conditions:
                      - evaluator: { type: gt, params: [2] }

            - uid: botchini-api-errors
              title: Botchini external API errors
              condition: C
              for: 5m
              noDataState: OK
              execErrState: Error
              labels:
                service: botchini
              notification_settings:
                receiver: Discord
                group_by: ["alertname"]
                repeat_interval: 4h
              annotations:
                summary: "{{ .Labels.service }} API requests are failing ({{ humanizePercentage .Values.B.Value }} errors)"
                description: "More than 20% of requests to this API returned an error or failed to connect over the last 10 minutes."
              data:
                - refId: A
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: PBFA97CFB590B2093
                  model:
                    refId: A
                    expr: >-
                      sum by (service) (rate(botchini_http_request_count{result="error"}[10m]))
                      / sum by (service) (rate(botchini_http_request_count[10m]))
                    instant: true
                - refId: B
                  datasourceUid: __expr__
                  model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
                - refId: C
                  datasourceUid: __expr__
                  model:
                    refId: C
                    type: threshold
                    expression: B
                    conditions:
                      - evaluator: { type: gt, params: [0.2] }

            - uid: botchini-down
              title: Botchini is down
              condition: C
              for: 3m
              noDataState: Alerting
              execErrState: Error
              labels:
                service: botchini
              notification_settings:
                receiver: Discord
                group_by: ["alertname"]
                repeat_interval: 4h
              annotations:
                summary: Botchini metrics can't be scraped
                description: "Alloy can't reach https://botchini-metrics.luca.codes/metrics, so the app is down or the tunnel/metrics port is misconfigured."
              data:
                - refId: A
                  relativeTimeRange: { from: 300, to: 0 }
                  datasourceUid: PBFA97CFB590B2093
                  model:
                    refId: A
                    expr: max(up{job="botchini"})
                    instant: true
                - refId: B
                  datasourceUid: __expr__
                  model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
                - refId: C
                  datasourceUid: __expr__
                  model:
                    refId: C
                    type: threshold
                    expression: B
                    conditions:
                      - evaluator: { type: lt, params: [1] }

  grafana_alerting_homelab:
    content: |
      apiVersion: 1

      # Rules for the stack itself and for the LXC it runs in. The Discord contact
      # point and the notification policy live in botchini.yaml; these rules only
      # reference it by name, so the two files never fight over the receiver.
      #
      # Deliberately NOT covered here:
      #
      #   * The LXC's own memory limit (6 GiB). cAdvisor runs *inside* the container
      #     and cgroup namespaces are off, so it reports the Proxmox node's memory
      #     (30.7 GiB) and the node's root cgroup — never the container's 6 GiB.
      #     /sys/fs/cgroup inside an LXC is the host's. That check belongs to the
      #     watchdog on the Hermes host, which asks the Proxmox API: the only vantage
      #     point that still answers when the container is unresponsive (which is
      #     exactly the failure we are guarding against).
      #   * Disk on the other 13 guests, same reason: there is no node-exporter.
      #     The watchdog reads every guest's RRD from the Proxmox API.
      #
      # What this file does catch, from inside: a scrape target that died silently,
      # a container walking up to its mem_limit, a container crash-looping under
      # `restart: unless-stopped`, an OOM kill, and the root filesystem filling up.
      groups:
        - orgId: 1
          name: homelab
          folder: Homelab
          interval: 1m
          rules:
            # A scrape target that stops answering breaks every rule that depends on
            # its metrics, silently. This is the failure that let tempo:3200 sit down
            # after a redeploy: nothing fired, because nothing was watching the
            # watchers. noDataState is Alerting for the same reason — if Prometheus
            # itself is unreachable, that is news, not "OK".
            - uid: homelab-stack-target-down
              title: Stack metrics target is down
              condition: C
              for: 5m
              noDataState: Alerting
              execErrState: Error
              labels:
                service: grafana-stack
                severity: critical
              notification_settings:
                receiver: Discord
                group_by: ["alertname", "job"]
                repeat_interval: 4h
              annotations:
                summary: "Prometheus can't scrape {{ .Labels.job }}"
                description: "One of the stack's own targets stopped answering. Check its last error under Prometheus > Status > Targets. Fix it before trusting any other alert: a target that returns nothing blinds the rules that query it."
              data:
                - refId: A
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: PBFA97CFB590B2093
                  model:
                    refId: A
                    expr: min by (job) (up{job=~"alloy|cadvisor|grafana|loki|prometheus|tempo"})
                    instant: true
                - refId: B
                  datasourceUid: __expr__
                  model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
                - refId: C
                  datasourceUid: __expr__
                  model:
                    refId: C
                    type: threshold
                    expression: B
                    conditions:
                      - evaluator: { type: lt, params: [1] }

            # Only the six containers that declare mem_limit have a limit to compare
            # against: the other twelve in this LXC (the *arr stack, qBittorrent,
            # Arcane) are unlimited, so a runaway one of those shows up as the LXC
            # itself growing — the watchdog's job, not this rule's.
            - uid: homelab-container-memory-high
              title: Container is close to its memory limit
              condition: C
              for: 15m
              noDataState: OK
              execErrState: Error
              labels:
                service: grafana-stack
                severity: warning
              notification_settings:
                receiver: Discord
                group_by: ["alertname", "name"]
                repeat_interval: 4h
              annotations:
                summary: "{{ .Labels.name }} is using {{ humanizePercentage .Values.B.Value }} of its memory limit"
                description: "Above 85% of mem_limit for 15 minutes. The limit is what protects the LXC: the kernel kills the biggest process inside the container instead of freezing the whole host. This is the warning before a container dies and takes its dependants with it — Alloy carries both the logs and the scrapes. Raise its mem_limit or find what grew."
              data:
                - refId: A
                  relativeTimeRange: { from: 900, to: 0 }
                  datasourceUid: PBFA97CFB590B2093
                  model:
                    refId: A
                    expr: max by (name) (container_memory_working_set_bytes{name=~".+"} / (container_spec_memory_limit_bytes{name=~".+"} > 0))
                    instant: true
                - refId: B
                  datasourceUid: __expr__
                  model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
                - refId: C
                  datasourceUid: __expr__
                  model:
                    refId: C
                    type: threshold
                    expression: B
                    conditions:
                      - evaluator: { type: gt, params: [0.85] }

            # `restart: unless-stopped` turns a crash loop into a quiet container that
            # keeps coming back: from the outside everything looks "up".
            - uid: homelab-container-restart-loop
              title: Container is restarting over and over
              condition: C
              for: 5m
              noDataState: OK
              execErrState: Error
              labels:
                service: grafana-stack
                severity: critical
              notification_settings:
                receiver: Discord
                group_by: ["alertname", "name"]
                repeat_interval: 4h
              annotations:
                summary: '{{ .Labels.name }} restarted {{ printf "%.0f" .Values.B.Value }} times in 15 minutes'
                description: "restart: unless-stopped hides this: the container keeps coming back and every restart loses whatever it was holding. Read its logs to find the reason."
              data:
                - refId: A
                  relativeTimeRange: { from: 900, to: 0 }
                  datasourceUid: PBFA97CFB590B2093
                  model:
                    refId: A
                    expr: max by (name) (changes(container_start_time_seconds{job="cadvisor"}[15m]))
                    instant: true
                - refId: B
                  datasourceUid: __expr__
                  model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
                - refId: C
                  datasourceUid: __expr__
                  model:
                    refId: C
                    type: threshold
                    expression: B
                    conditions:
                      - evaluator: { type: gt, params: [2] }

            # With mem_limit in place, an OOM kill is the designed failure mode: the
            # container dies instead of the LXC freezing. It is still worth a message,
            # because it means the limit was reached.
            - uid: homelab-container-oom-killed
              title: Container was OOM-killed
              condition: C
              for: 0s
              noDataState: OK
              execErrState: Error
              labels:
                service: grafana-stack
                severity: warning
              notification_settings:
                receiver: Discord
                group_by: ["alertname", "name"]
                repeat_interval: 4h
              annotations:
                summary: "{{ .Labels.name }} was killed by the kernel for using too much memory"
                description: "The container hit its mem_limit and the kernel killed its biggest process. It comes back on its own, but the work in flight is lost. Raise the limit or fix the leak."
              data:
                - refId: A
                  relativeTimeRange: { from: 900, to: 0 }
                  datasourceUid: PBFA97CFB590B2093
                  model:
                    refId: A
                    expr: max by (name) (increase(container_oom_events_total{job="cadvisor"}[15m]))
                    instant: true
                - refId: B
                  datasourceUid: __expr__
                  model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
                - refId: C
                  datasourceUid: __expr__
                  model:
                    refId: C
                    type: threshold
                    expression: B
                    conditions:
                      - evaluator: { type: gt, params: [0] }

            # The device is the LXC's own root LV, so this keeps working after the
            # disk is grown (the limit moves with it). This one matters because a full
            # filesystem is the failure mem_limit cannot protect against: docker can't
            # write, Loki can't compact, and the stack stops in ways that look
            # unrelated to disk.
            - uid: homelab-lxc-rootfs-full
              title: Arcane LXC root filesystem almost full
              condition: C
              for: 10m
              noDataState: OK
              execErrState: Error
              labels:
                severity: critical
              notification_settings:
                receiver: Discord
                group_by: ["alertname"]
                repeat_interval: 4h
              annotations:
                summary: "The Arcane LXC root filesystem is {{ humanizePercentage .Values.B.Value }} full"
                description: "Prometheus keeps 15 days of data and every container writes logs here. Grow the disk from the Proxmox host, without stopping anything: pct set 105 -rootfs local-lvm:vm-105-disk-0,size=32G"
              data:
                - refId: A
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: PBFA97CFB590B2093
                  model:
                    refId: A
                    expr: max(container_fs_usage_bytes{device="/dev/mapper/pve-vm--105--disk--0"} / container_fs_limit_bytes{device="/dev/mapper/pve-vm--105--disk--0"})
                    instant: true
                - refId: B
                  datasourceUid: __expr__
                  model: { refId: B, type: reduce, expression: A, reducer: last, settings: { mode: dropNN } }
                - refId: C
                  datasourceUid: __expr__
                  model:
                    refId: C
                    type: threshold
                    expression: B
                    conditions:
                      - evaluator: { type: gt, params: [0.9] }

  # END GENERATED CONFIGS

services:
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yaml
      # BEGIN GENERATED MOUNTS (scripts/embed_configs.py)
      - source: grafana_alerting_botchini
        target: /etc/grafana/provisioning/alerting/botchini.yaml
      - source: grafana_alerting_homelab
        target: /etc/grafana/provisioning/alerting/homelab.yaml
      # END GENERATED MOUNTS
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      # Grafana won't start if the alerting contact point has no URL, so fall back
      # to a placeholder until the webhook is set (alerts just fail to deliver)
      - DISCORD_ALERT_WEBHOOK_URL=${DISCORD_ALERT_WEBHOOK_URL:-http://localhost/discord-webhook-not-configured}
    mem_limit: 640m
    memswap_limit: 640m
    logging: *default-logging
    restart: unless-stopped
    networks:
      - observability

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
      - "--storage.tsdb.retention.time=15d"
    mem_limit: 512m
    memswap_limit: 512m
    logging: *default-logging
    restart: unless-stopped
    networks:
      - observability

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    configs:
      - source: loki_config
        target: /etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    mem_limit: 512m
    memswap_limit: 512m
    logging: *default-logging
    restart: unless-stopped
    networks:
      - observability

  tempo:
    image: grafana/tempo:2.6.1
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - tempo-data:/var/tempo
    configs:
      - source: tempo_config
        target: /etc/tempo.yaml
    command: ["-config.file=/etc/tempo.yaml"]
    mem_limit: 768m
    memswap_limit: 768m
    logging: *default-logging
    restart: unless-stopped
    networks:
      - observability

  alloy:
    image: grafana/alloy:latest
    ports:
      - "12345:12345"
      - "9095:9095"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    configs:
      - source: alloy_config
        target: /etc/alloy/config.alloy
    environment:
      - CF_ACCESS_CLIENT_ID=${CF_ACCESS_CLIENT_ID}
      - CF_ACCESS_CLIENT_SECRET=${CF_ACCESS_CLIENT_SECRET}
    # Alloy's UI listens on 127.0.0.1 by default, which isn't reachable through
    # the published port, so bind it to all interfaces inside the container
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    # 384m, not 256m: Alloy's own RSS measured 243MiB with the config in this
    # file, i.e. ~95% of the cap it shipped with.
    mem_limit: 384m
    memswap_limit: 384m
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - observability

  # cAdvisor: per-container CPU and memory for the stack's own containers.
  # It reads the host's cgroups, /proc and rootfs, which is why it needs
  # privileged mode — the same recipe the Pelican agent uses. If it ever
  # refuses to start inside this LXC, the fallback is Alloy's embedded
  # prometheus.exporter.cadvisor (what agents/pelican-wings uses).
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    # Deliberately no published port: 8080 on this LXC already belongs to
    # qBittorrent's WebUI, and "8080:8080" makes the container fail to create
    # ("port is already allocated" — the scrape then dies with
    # "lookup cadvisor: no such host"). Prometheus scrapes cadvisor:8080 over
    # the observability network, which does not need the host port.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    command:
      - "--housekeeping_interval=30s"
      # How long cAdvisor keeps container history in memory
      - "--storage_duration=5m"
    # 384m, not 256m: cAdvisor's RSS peaked at 222MiB within minutes of its
    # first start on this LXC (87% of the old cap) and does not settle — it
    # sawtooths with the container count, which only grows. An OOM here takes
    # out the per-container memory series everything else depends on.
    mem_limit: 384m
    memswap_limit: 384m
    logging: *default-logging
    restart: unless-stopped
    networks:
      - observability

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  tempo-data:

networks:
  observability:
    name: observability
    driver: bridge
