global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Botchini app metrics (PromEx)
  # Set BOTCHINI_HOST to the internal IP of the Coolify VM
  - job_name: "botchini"
    static_configs:
      - targets: ["BOTCHINI_HOST:4021"]
        labels:
          app: "botchini"
